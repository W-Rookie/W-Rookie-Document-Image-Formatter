name: build-release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: W-Rookie-Windows
          - os: macos-latest
            artifact: W-Rookie-macOS
          - os: ubuntu-latest
            artifact: W-Rookie-Linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and test
        run: |
          python -m pip install -e ".[hwp,dev]"
          python -m unittest discover -s tests -v
          python -m ruff check run_gui.pyw src tests scripts
      - name: Build native application
        run: python -m PyInstaller --noconfirm --clean --windowed --name W-Rookie --paths src --collect-data docpicalign launcher.py
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release
          Compress-Archive -Path dist\W-Rookie -DestinationPath release\W-Rookie-${{ github.ref_name }}-Windows.zip
      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          mkdir -p release
          codesign --force --deep --sign - dist/W-Rookie.app
          ditto -c -k --sequesterRsrc --keepParent dist/W-Rookie.app release/W-Rookie-${{ github.ref_name }}-macOS.zip
      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          mkdir -p release
          tar -C dist -czf release/W-Rookie-${{ github.ref_name }}-Linux.tar.gz W-Rookie
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release/*

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Generate SHA-256 checksums
        run: |
          cd release
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
